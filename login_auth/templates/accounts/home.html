{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<main class="mx-auto mt-20 w-[95%] max-w-md rounded-[10px] bg-[#222222] p-8 text-center text-white">
  <h1 class="mb-2 font-serif text-3xl">Welcome, {{ user.first_name }}!</h1>
  <p class="mb-6 text-sm">You are logged in as {{ user.email }}</p>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="h-[38px] w-full rounded bg-[#0000cc] text-white hover:bg-[#1a1aff]">Logout</button>
  </form>
</main>
{% endblock %}
